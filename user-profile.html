<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="user_profile.css">
</head>
<body>
    <header class="profile-header">
        <a class="link" href="index.html">← All users</a>
        <h1 id="name">User Profile</h1>
        <p id="email"></p>
    </header>
    <main class="profile-items">
        <p id="error-message" role="alert"></p>
        <section>
            <h2>Photos</h2>
            <div id="photos" class="photos-grid"></div>
        </section>
        <section>
            <h2>Comments</h2>
            <div id="comments" class="item-list"></div>
        </section>
        <section>
            <h2>Posts</h2>
            <div id="posts" class="item-list"></div>
        </section>
        <section>
            <h2>Todos</h2>
            <div id="todos" class="item-list"></div>
        </section>
        <section>
            <h2>Albums</h2>
            <div id="albums" class="item-list"></div>
        </section>
    </main>
    <script src="user-profile.js" type="module"></script>
</body>
</html>
