<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div>
            <p class="small-title">USER DASHBOARD</p>
            <h1>All Users</h1>
            <p class="subtitle">
                Select a user to explore their posts, albums, photos and more.
            </p>
        </div>
    </header>
    <main>
        <div id="users-container">
            <a class="user-link">
                <div class="card user-card">
                    <div class="avatar">
                        <span>👤</span>
                    </div>
                    <h2></h2>
                    <p>
                        <strong>Username</strong>
                        <span class="username"></span>
                    </p>
                    <p>
                        <strong>Email</strong>
                        <span class="email"></span>
                    </p>
                    <p>
                        <strong>Phone</strong>
                        <span class="phone"></span>
                    </p>
                    <p>
                        <strong>City</strong>
                        <span class="city"></span>
                    </p>
                    <div class="view-profile">
                        View Profile →
                    </div>
                </div>
            </a>
        </div>
    </main>
    <footer>
        <p>User Dashboard</p>
    </footer>
    <script src="script.js"></script>

</body>

</html>
